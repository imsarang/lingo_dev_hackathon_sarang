name: Build, Push and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lingo-dev-backend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/docker-compose.production.yml"
          target: "~/lingo-dev/"
          strip_components: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              sudo yum install -y docker || sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
            
            # Fix Docker permissions (add user to docker group if needed)
            if ! groups | grep -q docker; then
              sudo usermod -aG docker $USER
              newgrp docker || true
            fi
            
            # Use sudo for docker commands if permission denied
            if ! docker ps &> /dev/null 2>&1; then
              DOCKER_CMD="sudo docker"
              COMPOSE_PREFIX="sudo "
            else
              DOCKER_CMD="docker"
              COMPOSE_PREFIX=""
            fi
            
            # Ensure directory exists
            mkdir -p ~/lingo-dev
            cd ~/lingo-dev
            
            # Clean up any incorrectly placed files/directories
            if [ -d "backend" ]; then
              echo "Removing incorrectly placed backend directory..."
              rm -rf backend
            fi
            if [ -d "docker-compose.production.yml" ]; then
              rm -rf docker-compose.production.yml
            fi
            
            # Copy docker-compose file if not found (fallback)
            if [ ! -f "docker-compose.production.yml" ]; then
              echo "docker-compose.production.yml not found, downloading from repository..."
              curl -L -o docker-compose.production.yml https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/backend/docker-compose.production.yml || {
                echo "Failed to download file. Please ensure the file exists in the repository."
                exit 1
              }
            fi
            
            # Use docker compose (v2) or docker-compose (v1)
            if $DOCKER_CMD compose version &> /dev/null 2>&1; then
              COMPOSE_CMD="$COMPOSE_PREFIX docker compose"
            elif command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="$COMPOSE_PREFIX docker-compose"
            else
              echo "docker-compose not found"
              exit 1
            fi
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | $DOCKER_CMD login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Export DOCKERHUB_USERNAME for docker-compose
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            
            # Create .env file if it doesn't exist (docker-compose will use env vars from GitHub secrets if needed)
            if [ ! -f ".env" ]; then
              echo "Creating minimal .env file..."
              touch .env
            fi
            
            # Pull latest image and restart services
            echo "Pulling latest Docker image..."
            $COMPOSE_CMD -f docker-compose.production.yml pull || {
              echo "Failed to pull image. Check Docker Hub credentials and image name."
              exit 1
            }
            
            echo "Starting services..."
            $COMPOSE_CMD -f docker-compose.production.yml up -d || {
              echo "Failed to start services. Check logs with: docker compose -f docker-compose.production.yml logs"
              exit 1
            }
            
            echo "Service status:"
            $COMPOSE_CMD -f docker-compose.production.yml ps
            
            echo "Container logs (backend):"
            $COMPOSE_CMD -f docker-compose.production.yml logs --tail=50 backend || true